<!doctype html>
<!--
  Pas-Keshik Telegram Mini App — the only page of the app.
  Everything it loads comes from this repository (GitHub Pages); the only
  network calls go to the Supabase gateway. Every script, stylesheet and
  module reference carries ?v=<release version> so Telegram's cache can
  never serve a stale file (tests/version.test.js enforces it).
-->
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>پاس‌کشیک</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app/app.css?v=0.6.1">
  <script src="vendor/telegram-web-app.js?v=0.6.1"></script>
  <script type="module" src="app/main.js?v=0.6.1"></script>
</head>
<body>
  <div id="app"><div class="boot"><div class="spinner"></div></div></div>
</body>
</html>
