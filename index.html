<!DOCTYPE html>
<!--
  ============================================================================
  پاس‌کشیک  (index.html)
  ----------------------------------------------------------------------------
  This file is deliberately almost empty. It provides one container per screen
  and loads the four files that do the real work. Screen contents are built by
  app.js at runtime.

  Keeping the shell this thin means adding a screen touches config.js and
  app.js only — never this file, beyond one empty div.
  ============================================================================
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#01579B">
<title>پاس‌کشیک</title>

<!-- Telegram bridge. Loads first so window.Telegram exists before app.js runs. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Self-hosted font. Served from this same origin because both public CDNs
     proved unreachable in Iran during testing. -->
<link rel="stylesheet" href="fonts/vazirmatn.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="signup.css">
<link rel="stylesheet" href="main.css">
</head>

<body>

  <!-- One container per screen. Each stays empty until app.js fills it. -->
  <div class="screen" id="screen-logo"></div>
  <div class="screen" id="screen-intro"></div>
  <div class="screen" id="screen-signup"></div>
  <div class="screen" id="screen-main"></div>

  <!-- Shown only when the app is opened outside Telegram and the gate in
       config.js is switched on. -->
  <div class="screen" id="screen-blocked">
    <p id="blocked-message">لطفاً پاس‌کشیک را از داخل تلگرام باز کنید.</p>
  </div>

  <!-- Order matters: config defines values, utils defines helpers, and app
       uses both. Loading app.js first would fail on an undefined CONFIG. -->
  <script src="config.js"></script>
  <script src="illustrations.js"></script>
  <script src="jalali.js"></script>
  <script src="utils.js"></script>
  <script src="signup.js"></script>
  <script src="app.js"></script>

</body>
</html>
