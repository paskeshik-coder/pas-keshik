<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="font-family:monospace;font-size:13px;padding:10px;word-break:break-all">

<div id="log">starting...</div>

<script>
var URL_ = "https://cxksklayzylbqlbgjtsu.supabase.co/functions/v1/api";
var KEY_ = "sb_publishable_1P-ZdZ0s-eKWKjwzwmD53Q_TObriy_N";

var log = document.getElementById("log");
function p(t) { log.innerHTML += "<br><br>" + t; }

log.innerHTML = "script running";

try {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.ready) { tg.ready(); tg.expand(); }

  p("platform: " + (tg ? tg.platform : "no telegram"));
  p("initData length: " + (tg && tg.initData ? tg.initData.length : 0));
  p("key set: " + (KEY_ === "PUT_KEY_HERE" ? "NO - EDIT THE FILE" : "yes"));

  fetch(URL_, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": KEY_,
      "Authorization": "Bearer " + KEY_
    },
    body: JSON.stringify({ action: "ping", initData: (tg && tg.initData) || "" })
  })
  .then(function (r) {
    p("status: " + r.status);
    return r.text();
  })
  .then(function (t) {
    p("response: " + t);
  })
  .catch(function (e) {
    p("fetch failed: " + e.message);
  });

} catch (e) {
  p("script error: " + e.message);
}
</script>

</body>
</html>
