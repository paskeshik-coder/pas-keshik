<!DOCTYPE html>
<!--
  ============================================================================
  پاس‌کشیک — GATEWAY TEST  (apitest.html)  —  temporary, deleted once passing
  ----------------------------------------------------------------------------
  Proves the full chain in one call, before any real screen depends on it:

      Telegram supplies signed initData
        -> the app forwards it unchanged
          -> the Edge Function verifies the signature with the bot token
            -> the function reads the database
              -> a result comes back

  Five things can fail and they fail differently. Testing them together first
  means a later bug in a real screen is a bug in that screen, rather than one
  more suspect in a list of six.

  Opened outside Telegram this reports "no initData" and stops, which is
  correct: there is nothing to sign with.
  ============================================================================
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تست اتصال</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="fonts/vazirmatn.css">
<style>
  body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    background: #ECEFF1;
    margin: 0;
    padding: 14px;
    font-size: 14px;
    line-height: 1.9;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    word-break: break-all;
  }
  .name { font-weight: 700; margin-bottom: 6px; }
  .ok  { color: #2E7D32; }
  .bad { color: #C62828; }
  pre {
    background: #F5F5F5;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12px;
    direction: ltr;
    text-align: left;
    margin: 6px 0 0;
  }
</style>
</head>
<body>

<div id="out">در حال بررسی…</div>

<script>
/* CHANGE THIS if the project URL ever changes. */
const FUNCTION_URL = 'https://cxksklayzylbqlbgjtsu.supabase.co/functions/v1/api';

const out = document.getElementById('out');

/**
 * Append one result block.
 *
 * @param {string} name  Heading.
 * @param {string} html  Body; may contain markup.
 */
function show(name, html) {
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = '<div class="name">' + name + '</div>' + html;
  out.appendChild(div);
}

(async function run() {
  out.textContent = '';

  const tg = window.Telegram?.WebApp;
  tg?.ready?.();
  tg?.expand?.();

  const insideTelegram = tg && tg.platform !== 'unknown';
  show('محیط اجرا', insideTelegram
    ? '<span class="ok">داخل تلگرام — ' + tg.platform + '</span>'
    : '<span class="bad">خارج از تلگرام</span>');

  const initData = tg?.initData || '';

  /*
    initData is empty outside Telegram, and also inside it if the Mini App was
    not opened through a registered link. The second case is the one worth
    catching early: the page loads and looks fine, but nothing can ever
    authenticate.
  */
  if (!initData) {
    show('initData', '<span class="bad">خالی است</span><br>' +
      'برنامه باید از طریق دکمه منو یا لینک ربات باز شود.');
    return;
  }

  show('initData', '<span class="ok">دریافت شد — ' +
    initData.length + ' کاراکتر</span>');

  try {
    const response = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // The blob is forwarded byte for byte. Re-encoding or reordering it
      // would change the string that was signed and the signature would fail.
      body: JSON.stringify({ action: 'ping', initData })
    });

    const text = await response.text();
    let parsed;
    try { parsed = JSON.parse(text); } catch { parsed = null; }

    if (!response.ok) {
      show('پاسخ سرور',
        '<span class="bad">خطا — کد ' + response.status + '</span>' +
        '<pre>' + text + '</pre>');
      return;
    }

    show('پاسخ سرور', '<span class="ok">موفق</span><pre>' +
      JSON.stringify(parsed, null, 2) + '</pre>');

    if (parsed?.you) {
      show('هویت تأییدشده',
        'شناسه: ' + parsed.you.telegramId + '<br>' +
        'مالک: ' + (parsed.you.isOwner ? '<span class="ok">بله</span>'
                                       : '<span class="bad">خیر</span>') + '<br>' +
        'تعداد کاربران در دیتابیس: ' + parsed.userCount);
    }

  } catch (error) {
    // A network-level failure, distinct from the server answering with an
    // error — usually CORS, a wrong URL, or the function not deployed.
    show('اتصال', '<span class="bad">ناموفق</span><pre>' + error.message + '</pre>');
  }
})();
</script>

</body>
</html>
